[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbox"
version = "0.1.0"
description = "Config-driven function-wrapping architecture. Bring your own lego pieces."
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "tenacity>=9",
]

[tool.setuptools]
packages = ["toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises real wall-clock timing (retry sleeps, background worker thread)",
]
