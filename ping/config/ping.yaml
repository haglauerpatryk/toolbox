# ping's own config — separate from every toolbox config. The selector grammar
# is the toolbox one; here it just chooses which diagnostics ping runs on a
# matched function. Targets (which functions/files) live in targets.json,
# generated by the `ping` CLI.
ping:
  hooks:
    always:
      - ping_args
      - ping_time
      - ping_types
      - ping_error
  sinks:
    always:
      - ping_console
